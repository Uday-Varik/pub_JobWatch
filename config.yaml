notification:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  subject_prefix: "[JobWatch]"
  ntfy_server: https://ntfy.sh

  tiers:
    # PRIORITY 1: Companies with the highest chance of acceptance
    easy:
      subject_tag: "🎯 EASY ENTRY (APPLY FIRST!)"
      ntfy_priority: "5"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_EASY
        - JOBWATCH_NTFY_TOPIC
      alert: true
      email_bands: all

    # PRIORITY 2: High-volume hiring, fast response
    it_services:
      subject_tag: "📊 IT SERVICES (Fast Track)"
      ntfy_priority: "4"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_IT
        - JOBWATCH_NTFY_TOPIC
      alert: true
      email_bands: all

    # PRIORITY 3: Data-focused, strong teams
    fintech:
      subject_tag: "💰 FINTECH (Data Roles)"
      ntfy_priority: "4"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_FINTECH
        - JOBWATCH_NTFY_TOPIC
      alert: true
      email_bands: all

    # PRIORITY 4: Stretch targets
    moderate:
      subject_tag: "⚡ STRETCH (Big Tech)"
      ntfy_priority: "3"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_MODERATE
        - JOBWATCH_NTFY_TOPIC
      alert: true
      email_bands: all

    # Entry-level specific (routes here instead of company tier)
    newgrad:
      subject_tag: "🎓 NEW GRAD"
      ntfy_priority: "5"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_NEWGRAD
        - JOBWATCH_NTFY_TOPIC
      alert: true
      email_bands: all

ranking:
  top_picks: 10
  # Preferred = float to top of each alert
  preferred_companies:
