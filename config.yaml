# Set to true to stop fetching and alerting without touching anything else;
# the tracked state is preserved and resumes when set back to false.
paused: false

# Titles to match (case-insensitive substring). Edit to fit the roles you
# want; a company can override this list with its own `keywords:`.
keywords:
  - Software Engineer
  - Data Scientist
  - DataScientist
  - Software Development Engineer
  - Software Developer
  - Data Analyst
  - Staff Software
  - Senior Software
  - Full Stack
  - Fullstack
  - Backend Engineer
  - AI Engineer
  - ML Engineer
  - Machine Learning
  - Applied AI
  - Applied ML
  - LLM
  - Generative AI
  - GenAI
  - Inference
  - Agents
  - Research Engineer
  - Ai Agents



# Non-US locations are auto-filtered (India, UK, etc.)
# Additional location allowlist (empty = accept all US locations):
locations: []

filters:
  # Drop new-grad / early-career titles at the filter stage so they never
  # reach any tier.
  exclude_new_grad: true
  # Postings older than this are ignored. The pipeline runs twice on
  # weekdays only, so 72h covers Friday-afternoon-to-Monday-morning.
  max_age_hours: 72

retention:
  # How long a posting is remembered after it was LAST seen on a board.
  # While a job stays posted it is refreshed every run and never expires;
  # once it disappears it is kept this many more days so a repost is not
  # re-alerted. Jobs you mark applied/interview/offer are never deleted.
  job_days: 60
  # Per-source health history (feeds the weekly digest and anomaly checks).
  health_days: 30
  # Archive copy of each alert batch (only used to render the inbox file).
  batch_days: 14

runner:
  fast_workers: 8
  browser_workers: 1
  # Two runs a day means wall time is cheap; give big Workday boards room.
  fast_timeout_seconds: 300
  browser_timeout_seconds: 210

alerting:
  # Global default: Top/Strong roles interrupt via Gmail. Watch roles still land
  # in the workflow inbox and are marked seen so they do not repeat every run.
  # A tier can override this with its own email_bands (see notification.tiers).
  email_bands:
    - Top
    - Strong

companies:
  # Example list -- replace with the companies you want to watch.
  # Tiers route alerts (see notification.tiers): target / faang / other.
  # Find a company's board with `python discover.py "Company Name"`, or add
  # it by hand with name / tier / ats / slug (greenhouse, ashby, lever) or
  # tenant + site (workday). One example per common adapter below.

  - name: Stripe
    tier: target
    ats: greenhouse
    slug: stripe

  - name: Snowflake
    tier: target
    ats: ashby
    slug: snowflake

  - name: NVIDIA
    tier: other
    ats: workday
    tenant: nvidia.wd5
    site: NVIDIAExternalCareerSite
    max_pages: 120
    time_budget_seconds: 240   # large board; the default budget stops early

  - name: Netflix
    tier: faang
    ats: netflix

  - name: Google
    tier: faang
    ats: playwright
    slug: google
    # Per-company keywords replace the global list for this company only.
    keywords:
      - Machine Learning
      - Software Engineer
 # Newly list
  - name: Amazon
    tier: faang
    ats: amazon

  - name: Oracle
    tier: target
    ats: oracle
    host: eeho.fa.us2.oraclecloud.com
    site: CX_1

  - name: Salesforce
    tier: target
    ats: workday
    tenant: salesforce.wd12
    site: External_Career_Site

  - name: Uber
    tier: target
    ats: uber

  - name: Databricks
    tier: target
    ats: greenhouse
    slug: databricks

  - name: JPMorgan Chase
    tier: target
    ats: oracle
    host: jpmc.fa.oraclecloud.com
    site: CX_1001

  - name: Capital One
    tier: target
    ats: workday
    tenant: capitalone.wd12
    site: Capital_One

  - name: Goldman Sachs
    tier: target
    ats: playwright
    slug: goldman_sachs

  - name: Bank of America
    tier: target
    ats: workday
    tenant: ghr.wd1
    site: Lateral-US

  - name: Citi
    tier: target
