    site: Visa

  # Some boards sit behind bot walls (Akamai / CAPTCHA) and return nothing
  # to automated visits -- e.g. Apple, Meta, Microsoft, Tesla, Bloomberg.
  # Check those by hand.

notification:
  # Recipient defaults to JOBWATCH_EMAIL_USER if not set here.
  # Override with JOBWATCH_NOTIFY_EMAIL env var or uncomment below:
  # email: your_email@example.com
  smtp_host: smtp.gmail.com
  smtp_port: 587
  subject_prefix: "[JobWatch Inbox]"
  # Set these environment variables:
  #   JOBWATCH_EMAIL_USER=your_gmail@gmail.com
  #   JOBWATCH_EMAIL_PASSWORD=your_16_char_app_password
  #   JOBWATCH_NOTIFY_EMAIL=recipient@example.com  (optional, defaults to EMAIL_USER)
  # Push notifications via ntfy.sh (optional — set JOBWATCH_NTFY_TOPIC env var or uncomment below)
  # ntfy_topic: your-secret-topic-name
  ntfy_server: https://ntfy.sh

  # Tier routing: companies are tagged tier: target | faang | other.
  # Each alerting tier sends its own tagged email and its own ntfy topic so
  # the streams stay distinct on your phone. Set alert: false on a tier to
  # make it inbox-only (no email, no push).
  # ntfy topic resolves from the first env var in the list that is set.
  #
  # email_bands (per tier, optional): which rank bands to alert on. Defaults
  # to alerting.email_bands (Top/Strong). Sources with no posting date
  # (Playwright scrapes, Netflix) can never score above Watch, so target,
  # faang and newgrad alert on every band ("all") rather than losing them.
  tiers:
    target:
      subject_tag: "🎯 TARGET"
      ntfy_priority: "5"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_TARGET
        - JOBWATCH_NTFY_TOPIC   # reuse the existing subscribed topic
      alert: true
      email_bands: all
    faang:
      subject_tag: "🚀 FAANG"
      ntfy_priority: "4"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_FAANG
      alert: true
      email_bands: all
    other:
      subject_tag: "📋 OTHER"
      ntfy_priority: "3"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_OTHER
      alert: true   # uses the global Top/Strong gate
    # New-grad / entry-level roles from ANY company route here instead of
    # their company tier — a dedicated stream for new-grad hiring season.
    # Off by default (see filters.exclude_new_grad). Flip both on to
    # enable the stream.
    newgrad:
      subject_tag: "🎓 NEW GRAD"
      ntfy_priority: "5"
      ntfy_topic_env:
        - JOBWATCH_NTFY_TOPIC_NEWGRAD
      alert: false
      email_bands: all

ranking:
  top_picks: 5
  # +25 rank points: floats these to the top of each alert.
  preferred_companies:
    - Stripe
