# JobWatch Config - Focused on 40 companies easiest to enter as Masters-level new grad
# Tier strategy: Easy → IT Services → Fintech → Moderate
# Goal: Data Scientist, ML Engineer, Data Analyst entry-level roles

paused: false

keywords:
  - Data Scientist
  - Machine Learning Engineer
  - ML Engineer
  - Data Science
  - Applied Scientist
  - Data Analyst
  - Analytics Engineer
  - Data Engineer
  - Software Engineer
  - Software Developer
  - MLE

locations: []  # Accept all US

filters:
  exclude_new_grad: false  # KEEP entry-level roles
  max_age_hours: 72

retention:
  job_days: 60
  health_days: 30
  batch_days: 14

runner:
  fast_workers: 8
  browser_workers: 1
  fast_timeout_seconds: 300
  browser_timeout_seconds: 210

alerting:
  email_bands:
    - Top
    - Strong

